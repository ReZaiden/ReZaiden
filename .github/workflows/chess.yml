name: Interactive Chess Game

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'Chess:')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install dependencies
        run: |
          pip3 install chess --break-system-packages

      - name: Run Chess Move
        env:
          TITLE: ${{ github.event.issue.title }}
          USER: ${{ github.event.issue.user.login }}
        run: |
          if [[ "$TITLE" == "Chess: Start New Game"* ]]; then
            python3 .github/scripts/play_chess.py --action new
          elif [[ "$TITLE" == "Chess: Play "* ]]; then
            MOVE=$(echo "$TITLE" | sed 's/Chess: Play //')
            python3 .github/scripts/play_chess.py --action play --move "$MOVE" --user "$USER"
          else
            echo "Unknown chess action." > output/bot_msg.txt
          fi

      - name: Commit & Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore: update chess game board"
          git push

      - name: Comment and Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          MSG=$(cat output/bot_msg.txt)
          gh issue comment "$NUMBER" --body "$MSG"
          gh issue close "$NUMBER"
