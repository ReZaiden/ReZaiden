<svg width="900" height="270" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Card gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
  </defs>

  <!-- Card shell -->
  <rect width="900" height="270" rx="18" fill="url(#bg)" stroke="#00FFAA" stroke-width="1.2"/>

  <!-- Subtle inner glow at top -->
  <rect x="1" y="1" width="898" height="80" rx="17" fill="#00FFAA" fill-opacity="0.025"/>

  <!-- ── Channel header ── -->
  <clipPath id="avatarClip">
    <circle cx="55" cy="55" r="35"/>
  </clipPath>
  <circle cx="55" cy="55" r="35" fill="#1e2433"/>
  <image href="data:image/jpeg;base64," x="20" y="20" width="70" height="70" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Channel name -->
  <text x="106" y="48" fill="white" font-size="18" font-family="Arial, sans-serif" font-weight="bold">ʀᴇᴢᴀɪᴅᴇɴ👨🏻‍💻</text>

  <!-- @handle -->
  <text x="106" y="70" fill="#8b949e" font-size="13" font-family="Arial, sans-serif">@ReZaidenCH</text>

  <!-- Telegram icon (top-right) -->
  <g transform="translate(856,24)">
    <circle cx="11" cy="11" r="11" fill="#229ED9" fill-opacity="0.9"/>
    <text x="11" y="16" fill="white" font-size="13" font-family="Arial" text-anchor="middle">✈</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="104" x2="880" y2="104" stroke="#21262d" stroke-width="1"/>

  <!-- ── Latest post section ── -->

  <!-- "Latest Post" label -->
  <text x="170" y="132" fill="#00FFAA" font-size="12" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1">LATEST POST</text>

  <!-- Post body text -->
  <text x="170" y="158" fill="#c9d1d9" font-size="14" font-family="Arial, sans-serif">اکانت ۱۸ ماهه Gemini pro فقط ۴۰۰ هزارتومن؟🫡</text>

  <!-- Date -->
  <text x="170" y="244" fill="#8b949e" font-size="12" font-family="Arial, sans-serif">2026-08-05</text>

  <!-- "View Post →" link-style text -->
  <text x="878" y="244" fill="#00FFAA" font-size="13" font-family="Arial, sans-serif" text-anchor="end">View Post →</text>

  <!-- Post thumbnail -->
  <rect x="20" y="119" width="130" height="130" rx="12" fill="#1e2433"/>
  <text x="85" y="194" fill="#444" font-size="36" font-family="Arial" text-anchor="middle">📷</text>
</svg>
